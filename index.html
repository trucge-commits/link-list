<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Các liên kết</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;

    background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.8), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(255,255,255,0.7), transparent 35%),
        linear-gradient(135deg, #d9eee9, #c9dce8, #e8dfd0);

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 25px 15px;
    color: #333;
}

.container {
    width: 100%;
    max-width: 430px;

    background: rgba(255,255,255,0.72);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    border: 1px solid rgba(255,255,255,0.8);
    border-radius: 28px;

    padding: 32px 22px 25px;

    box-shadow:
        0 15px 40px rgba(50,70,80,0.15);

    text-align: center;
}

.avatar {
    width: 90px;
    height: 90px;

    margin: 0 auto 18px;

    border-radius: 50%;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 38px;

    background:
        linear-gradient(135deg, #ffffff, #d9eee9);

    border: 5px solid rgba(255,255,255,0.9);

    box-shadow:
        0 8px 20px rgba(50,70,80,0.15);
}

h1 {
    margin: 5px 0 8px;

    font-size: 27px;
    font-weight: 700;

    color: #30464b;
}

.subtitle {
    margin: 0 0 25px;

    font-size: 15px;
    color: #66777b;
}

.link {
    display: flex;
    align-items: center;

    width: 100%;

    margin: 13px 0;

    padding: 15px 17px;

    background: rgba(255,255,255,0.9);

    border-radius: 16px;

    text-decoration: none;
    color: #34474b;

    box-shadow:
        0 5px 15px rgba(50,70,80,0.08);

    transition: all 0.2s ease;
}

.link:hover {
    transform: translateY(-2px);

    box-shadow:
        0 8px 20px rgba(50,70,80,0.15);
}

.icon {
    width: 40px;
    height: 40px;

    border-radius: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-right: 13px;

    font-size: 21px;

    background: #edf5f3;
}

.link-text {
    flex: 1;

    text-align: left;

    font-size: 16px;
    font-weight: 600;
}

.arrow {
    font-size: 21px;
    color: #829497;
}

.note {
    margin-top: 25px;

    font-size: 13px;
    line-height: 1.6;

    color: #748386;
}

@media (max-width: 480px) {

    body {
        padding: 15px 12px;
    }

    .container {
        padding: 28px 18px 22px;
        border-radius: 24px;
    }

    h1 {
        font-size: 25px;
    }

    .link {
        padding: 14px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="avatar">
        🌿
    </div>

    <h1>Các liên kết</h1>

    <p class="subtitle">
        Những nội dung mình muốn chia sẻ
    </p>

    <a class="link"
       href="https://www.facebook.com/Trucge/posts/pfbid02vXasbabYmGDbTDDxdX2YF63LugSvxf525LbJVq6iC9vFmHY9Ji8bJ67rsfLNvsPHl"
       target="_blank">

        <div class="icon">f</div>

        <div class="link-text">
            Facebook bài đăng
        </div>

        <div class="arrow">›</div>

    </a>


    <a class="link"
       href="https://www.facebook.com/Trucge/posts/pfbid0Yj3Pa7RJc883Wp3bB66oKKrr91RRMaasEftBcvPUPTweYGDH1Z9z1GbSsxY6rPQfl"
       target="_blank">

        <div class="icon">f</div>

        <div class="link-text">
            Facebook bài đăng 2
        </div>

        <div class="arrow">›</div>

    </a>


    <a class="link"
       href="https://www.youtube.com/"
       target="_blank">

        <div class="icon">▶</div>

        <div class="link-text">
            YouTube
        </div>

        <div class="arrow">›</div>

    </a>


    <div class="note">
        Cảm ơn bạn đã ghé thăm 🌿
    </div>

</div>

</body>
</html>
